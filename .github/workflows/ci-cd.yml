name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: freshpick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d freshpick_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/freshpick_test?schema=public
      JWT_SECRET: test_jwt_secret_that_is_long_enough_for_tests
      NODE_ENV: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.17.0'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Apply database migrations
      run: npx prisma migrate deploy

    - name: Run linter
      run: npm run lint

    - name: Run unit and API tests
      run: npm run test:unit -- --runInBand
      env:
        FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
        FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}

    - name: Verify checkout transactions against isolated PostgreSQL
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/freshpick_test?schema=checkout_test_ci
        CHECKOUT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/freshpick_test?schema=checkout_test_ci
      run: |
        npx prisma migrate deploy
        npm run test:checkout-db

    - name: Build application
      run: npm run build
      env:
        NODE_ENV: production

    - name: Verify HTTP endpoints against the built app
      env:
        NODE_ENV: production
        BASE_URL: http://localhost:3000
      run: |
        npm start > /tmp/freshpick-server.log 2>&1 &
        server_pid=$!
        trap 'kill "$server_pid" 2>/dev/null || true' EXIT
        ready=false
        for attempt in $(seq 1 60); do
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/orders || true)
          if [ "$status" = "401" ]; then
            ready=true
            break
          fi
          sleep 1
        done
        if [ "$ready" != "true" ]; then
          cat /tmp/freshpick-server.log
          exit 1
        fi
        npm run test:smoke -- --runInBand

  deploy-preview:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Vercel Preview
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: ./

  deploy-production:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Vercel Production
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        vercel-args: '--prod'
        working-directory: ./

  smoke-test:
    if: github.ref == 'refs/heads/main'
    needs: deploy-production
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.17.0'

    - name: Install dependencies
      run: npm ci

    - name: Run smoke tests
      run: npm run test:smoke
      env:
        BASE_URL: ${{ secrets.PRODUCTION_URL }}
        API_KEY: ${{ secrets.API_KEY }}
