name: FreshPick visual review
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: freshpick_visual
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d freshpick_visual"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/freshpick_visual?schema=public
      JWT_SECRET: local_visual_review_only_not_a_production_secret
      FRESHPICK_VISUAL_FIXTURES: "1"
      VISUAL_LOGIN: visual-review@example.invalid
      VISUAL_PASSWORD: VisualFixtureOnly123!
      VISUAL_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.17.0'
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: node scripts/visual-review-seed.mjs
      - name: Install isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/freshpick-browser" --no-save --package-lock=false playwright@1.51.1
          "$RUNNER_TEMP/freshpick-browser/node_modules/.bin/playwright" install --with-deps chromium
      - run: npm run build
        env:
          NODE_ENV: production
      - name: Link isolated Playwright for screenshot script
        run: ln -s "$RUNNER_TEMP/freshpick-browser/node_modules/playwright" node_modules/playwright
      - name: Capture full pages
        run: |
          npm start -- --hostname 127.0.0.1 >/tmp/visual-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --output /dev/null "$VISUAL_BASE_URL/"; then ready=true; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then cat /tmp/visual-server.log; exit 1; fi
          node scripts/visual-review.mjs || { cat /tmp/visual-server.log; exit 1; }
      - name: Upload screenshots (isolated test data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freshpick-responsive-320-to-1440-review
          path: visual-review/*.png
          if-no-files-found: error
